<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo com gradiente circular no padrão da paleta Dark Fintech -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#062419" />
      <stop offset="100%" stop-color="#03100b" />
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c3d2b" />
      <stop offset="100%" stop-color="#03120d" />
    </linearGradient>
  </defs>

  <!-- Fundo do ícone com bordas arredondadas padrão de app moderno -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Círculo central com borda em neon -->
  <circle cx="256" cy="256" r="140" fill="url(#badgeGrad)" stroke="#00ff88" stroke-width="8" />

  <!-- Texto F.IA -->
  <text x="256" y="274" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="110" font-weight="900" fill="#00ff88" text-anchor="middle" letter-spacing="-2">F.IA</text>
</svg>