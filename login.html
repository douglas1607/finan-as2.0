<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinancIA Autônoma - Login</title>
    <link rel="stylesheet" href="style.css">

    <!-- Configurações PWA e Ícone do App -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#00ff88">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FinancIA">
</head>

<body class="login-page">
    <div class="login-card">
        <div class="logo-login">
            <div class="logo-icon-badge">
                <span>F.IA</span>
            </div>
            <div class="logo-text-group">
                <h1>Financ<span class="highlight-ia">IA</span></h1>
                <span class="subtext-autonoma">Autônoma</span>
            </div>
        </div>

        <div class="tabs-login" id="tabsLoginContainer">
            <button id="tabLogin" class="tab-btn active" onclick="mostrarAba('login')">Entrar</button>
            <button id="tabCadastro" class="tab-btn" onclick="mostrarAba('cadastro')">Cadastrar</button>
        </div>

        <!-- Form Login -->
        <form id="formLoginBox" onsubmit="efetuarLogin(event)">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary-block">Entrar no Painel</button>
            <div style="margin-top: 15px; text-align: center;">
                <a href="#" onclick="mostrarEsqueciSenha(event)"
                    style="color: #00ff88; font-size: 13px; text-decoration: none;">Esqueceu a senha? Redefinir</a>
            </div>
        </form>

        <!-- Form Cadastro -->
        <form id="formCadastroBox" style="display: none;" onsubmit="efetuarCadastro(event)">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="cadNome" placeholder="Seu nome" required>
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="cadEmail" placeholder="seuemail@exemplo.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="cadSenha" placeholder="Crie uma senha forte" required>
            </div>
            <button type="submit" class="btn-primary-block">Criar Minha Conta</button>
        </form>

        <!-- Form Esqueci a Senha -->
        <form id="formEsqueciBox" style="display: none;" onsubmit="redefinirSenha(event)">
            <div class="input-group">
                <label>E-mail Cadastrado</label>
                <input type="email" id="recEmail" placeholder="seuemail@exemplo.com" required>
            </div>
            <div class="input-group">
                <label>Nova Senha</label>
                <input type="password" id="recNovaSenha" placeholder="Digite a nova senha" required>
            </div>
            <button type="submit" class="btn-primary-block">Atualizar Senha</button>
            <div style="text-align: center; margin-top: 12px;">
                <a href="#" onclick="mostrarAba('login')"
                    style="color: #fff; font-size: 13px; text-decoration: none;">Voltar para o Login</a>
            </div>
        </form>
    </div>

    <script>
        const API_URL = 'https://finan-as2-0.onrender.com/api';

        function mostrarAba(aba) {
            document.getElementById('tabsLoginContainer').style.display = 'flex';
            document.getElementById('tabLogin').classList.toggle('active', aba === 'login');
            document.getElementById('tabCadastro').classList.toggle('active', aba === 'cadastro');
            document.getElementById('formLoginBox').style.display = aba === 'login' ? 'flex' : 'none';
            document.getElementById('formCadastroBox').style.display = aba === 'cadastro' ? 'flex' : 'none';
            document.getElementById('formEsqueciBox').style.display = 'none';
        }

        function mostrarEsqueciSenha(e) {
            if (e) e.preventDefault();
            document.getElementById('tabsLoginContainer').style.display = 'none';
            document.getElementById('formLoginBox').style.display = 'none';
            document.getElementById('formCadastroBox').style.display = 'none';
            document.getElementById('formEsqueciBox').style.display = 'flex';
        }

        async function efetuarLogin(e) {
            if (e) e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('financia_token', data.token);
                    localStorage.setItem('financia_user', data.nome);
                    window.location.href = 'index.html';
                } else {
                    alert(data.erro || 'Falha no login');
                }
            } catch (err) {
                console.error("Erro no Login:", err);
                alert('Servidor desconectado! Verifique o terminal.');
            }
        }

        async function efetuarCadastro(e) {
            if (e) e.preventDefault();

            const nome = document.getElementById('cadNome').value.trim();
            const email = document.getElementById('cadEmail').value.trim();
            const senha = document.getElementById('cadSenha').value;

            try {
                const res = await fetch(`${API_URL}/cadastrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Conta criada com sucesso! Faça login.');
                    mostrarAba('login');
                } else {
                    alert(data.erro || 'Erro ao cadastrar');
                }
            } catch (err) {
                console.error("Erro no Cadastro:", err);
                alert('Servidor desconectado! Verifique o terminal.');
            }
        }

        async function redefinirSenha(e) {
            if (e) e.preventDefault();

            const email = document.getElementById('recEmail').value.trim();
            const novaSenha = document.getElementById('recNovaSenha').value;

            try {
                const res = await fetch(`${API_URL}/esqueci-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, novaSenha })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(data.mensagem);
                    mostrarAba('login');
                } else {
                    alert(data.erro || 'Erro ao redefinir senha');
                }
            } catch (err) {
                console.error("Erro:", err);
                alert('Erro ao conectar com o servidor.');
            }
        }
    </script>
</body>

</html>
